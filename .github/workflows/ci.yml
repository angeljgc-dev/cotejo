name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, formato, tipos y pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cotejo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Las pruebas crean y borran una base propia por sesión; por eso el usuario es el superusuario del servicio.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cotejo_test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Pruebas
        run: uv run pytest -q

  frontend:
    name: Frontend (verify y build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Lint, tipos y pruebas
        run: npm run verify
      - name: Build
        run: npm run build

  contenedor:
    name: Imagen, prueba de humo y e2e
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir y levantar el compose
        run: docker compose up --build --wait --wait-timeout 300
      - name: Prueba de humo
        run: bash .github/scripts/humo.sh http://localhost:8000
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias del frontend
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium de Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e contra el contenedor
        working-directory: web
        env:
          COTEJO_URL: http://localhost:8000
        run: npm run e2e
      - name: Registros del compose
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reporte-playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Apagar el compose
        if: always()
        run: docker compose down -v

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .github/gitleaks.toml
          # La acción trae fijada la 8.24.3; se usa la versión con la que se probó la configuración.
          GITLEAKS_VERSION: "8.30.1"
